name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Portão bloqueante. Não depende de Docker nem de banco, porque a suíte de falso
  # positivo da §7 é a última coisa que pode ficar refém de infra pesada.
  quality:
    name: lint, typecheck, build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Migrations, RPC, RLS e ciclo completo contra Postgres de verdade.
  integration:
    name: integração com Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sobe o Supabase local (aplica as migrations)
        run: supabase start

      # As credenciais locais mudam entre versões do CLI, então são lidas do stack que
      # acabou de subir em vez de assumidas. Hardcodá-las fez o job pular tudo em silêncio.
      - name: Exporta as credenciais do stack
        run: |
          echo "Chaves disponíveis no status:"
          supabase status -o json | jq -r 'keys[]'

          URL=$(supabase status -o json | jq -r '.API_URL // empty')
          KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')
          SECRET=$(supabase status -o json | jq -r '.JWT_SECRET // empty')

          # Falhar aqui, com nome, é melhor que a suíte pular 24 testes lá na frente.
          for pair in "API_URL:$URL" "SERVICE_ROLE_KEY:$KEY" "JWT_SECRET:$SECRET"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::${pair%%:*} veio vazio do supabase status"
              exit 1
            fi
          done

          {
            echo "TEST_SUPABASE_URL=$URL"
            echo "TEST_SERVICE_ROLE_KEY=$KEY"
            echo "TEST_JWT_SECRET=$SECRET"
          } >> "$GITHUB_ENV"

      - run: npm ci

      - name: Testes, exigindo que a integração tenha rodado
        run: |
          npm test 2>&1 | tee resultado.txt
          # Sem banco a suíte pula em silêncio e o job passaria sem testar nada.
          if grep -q "skipped" resultado.txt; then
            echo "::error::testes de integração foram pulados; o banco não subiu"
            exit 1
          fi

      - if: always()
        run: supabase stop --no-backup
